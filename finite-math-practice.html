<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camila · Finite Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#33252c; --paper:#fdf8f7; --card:#ffffff;
    --sage:#ec4899; --sage-deep:#be185d; --sage-soft:#fce7f3;
    --sun:#f4c64a; --sun-soft:#fdf3d3;
    --coral:#e0526a; --coral-soft:#fbe2e6;
    --green:#3f9a6a; --green-soft:#e3f3ea;
    --line:#eedce9; --muted:#8a7d83;
    --radius:16px; --shadow:0 1px 2px rgba(35,48,42,.05),0 8px 24px rgba(35,48,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 16px 64px}
  .wrap{max-width:720px;margin:0 auto}
  .homelink{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--sage-deep);text-decoration:none;padding:20px 0 0}
  .homelink:hover{color:var(--ink)}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}

  header{padding:14px 0 6px}
  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-deep);margin-bottom:8px}
  h1{font-size:1.95rem;font-weight:800;line-height:1.05}
  h1 .sub{display:block;font-size:1rem;font-weight:600;color:var(--muted);margin-top:6px}
  .syncpill{display:inline-block;margin-top:12px;font-size:.74rem;font-weight:700;letter-spacing:.02em;
    color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:5px 12px;cursor:pointer;transition:.16s}
  .syncpill:hover{border-color:var(--sage)}
  .syncpill.on{color:var(--sage-deep);background:var(--sage-soft);border-color:var(--sage)}

  .units{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0 8px}
  .unit{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:15px;
    text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:.16s;font-family:inherit}
  .unit:hover{border-color:var(--sage);transform:translateY(-1px)}
  .unit .un{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-deep)}
  .unit .ut{font-family:'Bricolage Grotesque';font-weight:700;font-size:1.02rem;margin:3px 0 2px}
  .unit .us{font-size:.76rem;color:var(--muted)}
  .unit .best{font-size:.72rem;font-weight:700;color:var(--green);margin-top:7px}
  .unit .exam{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    background:var(--sun-soft);color:#9a6f12;padding:2px 6px;border-radius:5px;margin-top:7px}
  .allbtn{grid-column:1/-1;background:var(--sage-deep);color:#fff;border:none;border-radius:var(--radius);
    padding:15px;font-family:'Bricolage Grotesque';font-weight:700;font-size:1.02rem;cursor:pointer;box-shadow:var(--shadow)}
  .allbtn:hover{background:#34503f}

  #quiz{display:none}
  .qbar{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
  .back{background:none;border:none;color:var(--sage-deep);font-weight:600;font-size:.85rem;cursor:pointer;font-family:inherit}
  .qmeta{flex:1;text-align:center;font-size:.8rem;color:var(--muted);font-weight:600}
  .score{font-size:.8rem;font-weight:700;color:var(--sage-deep)}
  .progwrap{height:6px;background:var(--sage-soft);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .progwrap i{display:block;height:100%;background:var(--sage);transition:.3s}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .qtopic{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage);margin-bottom:9px}
  .qtext{font-size:1.12rem;font-weight:600;font-family:'Bricolage Grotesque';line-height:1.35;margin-bottom:18px}
  .qtext .mono,.explain .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92em;background:var(--sage-soft);
    padding:1px 6px;border-radius:5px;font-weight:600}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;
    cursor:pointer;transition:.14s;background:var(--paper);font-size:.96rem;text-align:left;font-family:inherit;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--sage)}
  .opt .key{font-weight:700;color:var(--sage-deep);width:18px;flex:none}
  .opt.correct{background:var(--green-soft);border-color:var(--green)}
  .opt.correct .key{color:var(--green)}
  .opt.wrong{background:var(--coral-soft);border-color:var(--coral)}
  .opt.wrong .key{color:var(--coral)}
  .opt:disabled{cursor:default}

  .explain{margin-top:16px;border-top:1px solid var(--line);padding-top:15px;display:none}
  .explain.show{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .verdict{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.05rem;margin-bottom:6px}
  .verdict.ok{color:var(--green)} .verdict.no{color:var(--coral)}
  .explain p{font-size:.92rem;color:#404a44}
  .next{margin-top:16px;width:100%;background:var(--sage-deep);color:#fff;border:none;border-radius:12px;
    padding:14px;font-family:'Bricolage Grotesque';font-weight:700;font-size:1rem;cursor:pointer}
  .next:hover{background:#34503f}

  #done{display:none;text-align:center}
  .donecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px 24px;box-shadow:var(--shadow);margin-top:26px}
  .donecard .pct{font-family:'Bricolage Grotesque';font-size:3.6rem;font-weight:800;line-height:1}
  .donecard .msg{font-family:'Bricolage Grotesque';font-weight:700;font-size:1.2rem;margin:10px 0 4px}
  .donecard .sub{color:var(--muted);font-size:.9rem}
  .donecard .acts{display:flex;gap:10px;margin-top:24px}
  .donecard .acts button{flex:1;border-radius:12px;padding:13px;font-family:'Bricolage Grotesque';font-weight:700;
    font-size:.95rem;cursor:pointer;border:1.5px solid var(--sage-deep)}
  .donecard .acts .retry{background:var(--sage-deep);color:#fff}
  .donecard .acts .home{background:var(--card);color:var(--sage-deep)}

  footer{text-align:center;font-size:.74rem;color:var(--muted);margin-top:30px}
  @media(max-width:560px){.units{grid-template-columns:1fr}h1{font-size:1.65rem}}
</style>
</head>
<body>
<div class="wrap">

  <a class="homelink" href="index.html">&larr; Home Base</a>

  <div id="home">
    <header>
      <div class="eyebrow">Ivy Tech · MATH 135 · Finite Math</div>
      <h1>Practice Studio<span class="sub">Pick a unit and work through problems with full solutions</span></h1>
      <span class="syncpill" id="syncPill" title="Click to change the sync code">⟳ Local only</span>
    </header>
    <div class="units" id="unitGrid"></div>
    <footer>Best scores save per access code · ★ marks topics on the midterm</footer>
  </div>

  <div id="quiz">
    <div class="qbar">
      <button class="back" id="backBtn">← Units</button>
      <span class="qmeta" id="qMeta"></span>
      <span class="score" id="scoreLbl">0 correct</span>
    </div>
    <div class="progwrap"><i id="prog" style="width:0%"></i></div>
    <div class="qcard">
      <div class="qtopic" id="qTopic"></div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain">
        <div class="verdict" id="verdict"></div>
        <p id="explainText"></p>
        <button class="next" id="nextBtn">Next question</button>
      </div>
    </div>
  </div>

  <div id="done">
    <div class="donecard">
      <div class="pct" id="donePct"></div>
      <div class="msg" id="doneMsg"></div>
      <div class="sub" id="doneSub"></div>
      <div class="acts">
        <button class="retry" id="retryBtn">Try again</button>
        <button class="home" id="homeBtn">Other units</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ QUESTION BANK (all answers verified) ============ */
const UNITS = [
  {id:"u1", name:"Unit 1", title:"Linear Equations & Graphs", sec:"§1.1–1.2", exam:true, q:[
    {t:"Slope & lines", q:"Find the slope of the line through the points (2, 3) and (6, 11).",
     o:["2","4","½","8"], a:0, e:"Slope = (change in y)/(change in x) = (11−3)/(6−2) = 8/4 = <b>2</b>."},
    {t:"Slope & lines", q:"Find the slope of the line through (−2, 5) and (4, −7).",
     o:["−2","2","−½","−12"], a:0, e:"Slope = (−7−5)/(4−(−2)) = −12/6 = <b>−2</b>."},
    {t:"Solving equations", q:"Solve for x: <span class='mono'>3x − 7 = 2x + 5</span>.",
     o:["x = −2","x = 12","x = 2","x = 6"], a:1, e:"Subtract 2x: x − 7 = 5. Add 7: <b>x = 12</b>."},
    {t:"Solving equations", q:"Solve for x: <span class='mono'>5(x − 2) = 3x + 4</span>.",
     o:["x = 7","x = 3","x = 1","x = −7"], a:0, e:"Distribute: 5x − 10 = 3x + 4. Subtract 3x: 2x − 10 = 4. Add 10: 2x = 14, so <b>x = 7</b>."},
    {t:"Slope-intercept", q:"Write the equation of the line with slope −3 that passes through (0, 4).",
     o:["y = 4x − 3","y = −3x + 4","y = 3x + 4","y = −3x − 4"], a:1, e:"A point at (0, 4) is the y-intercept. y = mx + b gives <b>y = −3x + 4</b>."},
    {t:"Parallel lines", q:"What is the slope of any line parallel to <span class='mono'>y = 2x + 1</span>?",
     o:["−½","2","−2","1"], a:1, e:"Parallel lines have equal slopes. The slope here is <b>2</b>."},
    {t:"Evaluating", q:"On the line <span class='mono'>y = −2x + 10</span>, what is y when x = 3?",
     o:["4","16","−4","7"], a:0, e:"Substitute x = 3: y = −2(3) + 10 = −6 + 10 = <b>4</b>."},
    {t:"Standard form", q:"Rewrite <span class='mono'>2x − y = 6</span> in slope-intercept form. What is the slope?",
     o:["2","−2","6","−6"], a:0, e:"Solve for y: −y = −2x + 6, so y = 2x − 6. The slope is <b>2</b>."},
    {t:"Linear models", q:"A phone plan charges $20/month plus $0.10 per minute. What's the cost for a month with 150 minutes?",
     o:["$30","$35","$50","$170"], a:1, e:"Cost = 20 + 0.10(150) = 20 + 15 = <b>$35</b>."},
    {t:"Break-even", q:"Cost is <span class='mono'>C = 50 + 4x</span> and revenue is <span class='mono'>R = 9x</span>. How many units to break even?",
     o:["5","10","50","25"], a:1, e:"Set C = R: 50 + 4x = 9x → 50 = 5x → <b>x = 10</b> units."},
    {t:"Intercepts", q:"Find the x-intercept of <span class='mono'>2x + 5y = 10</span>.",
     o:["(0, 2)","(5, 0)","(2, 0)","(0, 5)"], a:1, e:"x-intercept is where y = 0: 2x = 10, so x = 5 → <b>(5, 0)</b>."},
    {t:"Intercepts & slope", q:"A line has x-intercept (4, 0) and y-intercept (0, 8). What is its slope?",
     o:["2","−2","½","−½"], a:1, e:"Slope = (8 − 0)/(0 − 4) = 8/(−4) = <b>−2</b>."},
    {t:"Inequalities", q:"Solve: <span class='mono'>4x − 3 > 9</span>.",
     o:["x > 3","x < 3","x > 1.5","x > 12"], a:0, e:"Add 3: 4x > 12. Divide by 4: <b>x > 3</b>."},
    {t:"Linear depreciation", q:"Equipment worth $12,000 depreciates $1,500 per year. What is its value after 5 years?",
     o:["$7,500","$4,500","$6,000","$3,000"], a:1, e:"Value = 12,000 − 1,500(5) = 12,000 − 7,500 = <b>$4,500</b>."},
    {t:"Special lines", q:"What is the equation of the line through (1, 2) and (3, 2)?",
     o:["x = 2","y = 2","y = x + 1","y = 2x"], a:1, e:"Both points have y = 2 — a horizontal line: slope 0, equation <b>y = 2</b>."},
    {t:"Linear model · build", q:"A gym's membership grew from 200 in 2016 to 480 in 2020. Let m = members and t = years since 2016. Which equation fits?",
     o:["m = 70t + 200","m = 70t + 480","m = 200t + 70","m = −70t + 200"], a:0,
     e:"Use the points (0, 200) and (4, 480). Slope = (480 − 200)/(4 − 0) = 70; the value at t = 0 is the intercept, 200. So m = 70t + 200."},
    {t:"Linear model · predict", q:"Using m = 70t + 200 (t = years since 2016), in what year does membership reach 760?",
     o:["2024","2022","2020","2026"], a:0,
     e:"Set m = 760: 70t + 200 = 760 → 70t = 560 → t = 8. Year = 2016 + 8 = 2024."},
    {t:"Linear model · build", q:"A product's market share fell from 52% in 2013 to 24% in 2020. Let s = share and t = years since 2013. Which equation fits?",
     o:["s = −4t + 52","s = −4t + 24","s = 4t + 52","s = −52t + 4"], a:0,
     e:"Points (0, 52) and (7, 24). Slope = (24 − 52)/(7 − 0) = −28/7 = −4; intercept (at t = 0) is 52. So s = −4t + 52."},
    {t:"Linear model · predict", q:"Using s = −4t + 52 (t = years since 2013), during what year does the share first fall below 9%?",
     o:["2024","2023","2025","2027"], a:0,
     e:"Set s = 9: 9 = −4t + 52 → −4t = −43 → t = 10.75. To fall BELOW 9%, round up to the next whole year, t = 11. Year = 2013 + 11 = 2024. (Check: t = 10 gives 12%, t = 11 gives 8%.)"},
    {t:"Linear model · build", q:"Average rent rose from $800 in 2018 to $1,160 in 2022. Let r = rent and t = years since 2018. Which equation fits?",
     o:["r = 90t + 800","r = 90t + 1160","r = 800t + 90","r = −90t + 800"], a:0,
     e:"Points (0, 800) and (4, 1160). Slope = (1160 − 800)/4 = 90; intercept 800. So r = 90t + 800."},
    {t:"Linear model · predict", q:"Using r = 90t + 800 (t = years since 2018), in what year does rent first exceed $1,500?",
     o:["2026","2025","2027","2024"], a:0,
     e:"Set r = 1500: 90t + 800 = 1500 → 90t = 700 → t ≈ 7.78. To EXCEED $1,500, round up to t = 8. Year = 2018 + 8 = 2026. (Check: t = 7 gives $1,430, t = 8 gives $1,520.)"},
  ]},

  {id:"u2", name:"Unit 2", title:"Matrices & Systems", sec:"§4.1–4.6", exam:true, q:[
    {t:"Solving systems", q:"Solve: <span class='mono'>x + y = 10</span> and <span class='mono'>x − y = 4</span>.",
     o:["(7, 3)","(3, 7)","(6, 4)","(5, 5)"], a:0, e:"Add the equations: 2x = 14, x = 7. Then 7 + y = 10 → y = 3 → <b>(7, 3)</b>."},
    {t:"Solving systems", q:"Solve: <span class='mono'>2x + y = 7</span> and <span class='mono'>x − y = 2</span>.",
     o:["(3, 1)","(1, 3)","(2, 3)","(3, −1)"], a:0, e:"Add the equations: 3x = 9, x = 3. Then 3 − y = 2 → y = 1 → <b>(3, 1)</b>."},
    {t:"Elimination", q:"Solve: <span class='mono'>x + 2y = 11</span> and <span class='mono'>3x − 2y = 1</span>.",
     o:["(3, 4)","(4, 3)","(5, 3)","(3, 5)"], a:0, e:"Add to cancel y: 4x = 12, x = 3. Then 3 + 2y = 11 → 2y = 8 → y = 4 → <b>(3, 4)</b>."},
    {t:"Matrix addition", q:"Add: <span class='mono'>[[1,2],[3,4]] + [[5,6],[7,8]]</span>.",
     o:["[[6,8],[10,12]]","[[5,12],[21,32]]","[[6,8],[9,11]]","[[4,4],[4,4]]"], a:0,
     e:"Add entry by entry: 1+5, 2+6, 3+7, 4+8 → <b>[[6,8],[10,12]]</b>."},
    {t:"Matrix subtraction", q:"Subtract: <span class='mono'>[[5,3],[2,8]] − [[1,4],[2,3]]</span>.",
     o:["[[4,−1],[0,5]]","[[6,7],[4,11]]","[[4,1],[0,5]]","[[4,−1],[4,5]]"], a:0,
     e:"Subtract entry by entry: 5−1, 3−4, 2−2, 8−3 → <b>[[4,−1],[0,5]]</b>."},
    {t:"Scalar multiplication", q:"Compute: <span class='mono'>3 × [[2,−1],[0,4]]</span>.",
     o:["[[5,2],[3,7]]","[[6,−3],[0,12]]","[[6,−1],[0,4]]","[[2,−3],[0,12]]"], a:1,
     e:"Multiply every entry by 3: 6, −3, 0, 12 → <b>[[6,−3],[0,12]]</b>."},
    {t:"Scalar multiplication", q:"Compute: <span class='mono'>2 × [[3,−1,0],[2,4,−5]]</span>.",
     o:["[[6,−2,0],[4,8,−10]]","[[5,1,2],[4,6,−3]]","[[6,−1,0],[4,4,−5]]","[[3,−2,0],[2,8,−10]]"], a:0,
     e:"Double every entry → <b>[[6,−2,0],[4,8,−10]]</b>."},
    {t:"Matrix dimensions", q:"If A is 2×3 and B is 3×4, what are the dimensions of AB?",
     o:["3×3","2×4","2×3","Cannot multiply"], a:1, e:"Inner dimensions match (3 = 3). Product uses outer dimensions: <b>2×4</b>."},
    {t:"Matrix dimensions", q:"If A is 3×2 and B is 2×2, what are the dimensions of AB?",
     o:["2×2","3×2","2×3","Cannot multiply"], a:1, e:"Inner dimensions match (2 = 2). Product uses outer dimensions: <b>3×2</b>."},
    {t:"Transpose", q:"The transpose of a 2×3 matrix has what dimensions?",
     o:["2×3","3×2","2×2","3×3"], a:1, e:"Transposing swaps rows and columns, so a 2×3 becomes <b>3×2</b>."},
    {t:"Identity matrix", q:"What is the product of any square matrix A with the identity matrix I?",
     o:["The zero matrix","A (unchanged)","The inverse of A","I"], a:1, e:"The identity acts like '1' for matrices: A · I = <b>A</b>."},
    {t:"Matrix multiplication", q:"Multiply the row [1 2 3] by the column [4; 5; 6].",
     o:["32","45","21","[4,10,18]"], a:0, e:"Multiply matching entries and add: 1·4 + 2·5 + 3·6 = 4 + 10 + 18 = <b>32</b>."},
    {t:"Matrix × vector", q:"Compute <span class='mono'>[[1,2],[3,4]] × [1; 1]</span>.",
     o:["[3; 7]","[1; 1]","[2; 4]","[4; 6]"], a:0, e:"Row dot products: 1·1+2·1 = 3 and 3·1+4·1 = 7 → <b>[3; 7]</b>."},
    {t:"Determinant", q:"Find the determinant of <span class='mono'>[[1,2],[3,4]]</span>.",
     o:["−2","2","10","−10"], a:0, e:"det = ad − bc = (1)(4) − (2)(3) = 4 − 6 = <b>−2</b>."},
    {t:"Reading RREF", q:"A reduced matrix is <span class='mono'>[[1,0 | 5],[0,1 | −2]]</span>. What is the solution?",
     o:["x = 5, y = −2","x = −2, y = 5","x = 0, y = 0","No solution"], a:0, e:"Read directly: row 1 gives x = 5, row 2 gives y = −2 → <b>x = 5, y = −2</b>."},
    {t:"Matrix multiplication", q:"Multiply: <span class='mono'>[[2,0],[1,3]] × [[1,4],[2,1]]</span>.",
     o:["[[2,8],[7,7]]","[[3,4],[3,4]]","[[2,0],[2,3]]","[[6,8],[7,7]]"], a:0,
     e:"Dot products: (2·1+0·2, 2·4+0·1)=(2,8); (1·1+3·2, 1·4+3·1)=(7,7) → <b>[[2,8],[7,7]]</b>."},
  ]},

  {id:"h41", name:"Homework drills", title:"Systems & Matrices", sec:"§4.1–4.2", exam:true, q:[
    {t:"Point-slope form", q:"Find the point-slope equation for the line through (1, 2) and (4, 11).",
     o:["y − 2 = 3(x − 1)","y + 2 = 3(x − 1)","y − 2 = 3(x + 1)","y − 1 = 3(x − 2)"], a:0,
     e:"Slope = (11 − 2)/(4 − 1) = 9/3 = 3. Point-slope with (1, 2): y − 2 = 3(x − 1)."},
    {t:"Point-slope form", q:"Find the point-slope equation for the line through (−2, 7) and (2, −1).",
     o:["y + 1 = −2(x − 2)","y − 1 = −2(x + 2)","y + 1 = 2(x − 2)","y + 7 = −2(x + 2)"], a:0,
     e:"Slope = (−1 − 7)/(2 − (−2)) = −8/4 = −2. Using the point (2, −1): y + 1 = −2(x − 2)."},
    {t:"Point-slope → slope-intercept", q:"Convert y − 3 = 2(x − 1) to slope-intercept form.",
     o:["y = 2x + 1","y = 2x − 1","y = 2x + 3","y = 2x − 2"], a:0,
     e:"Distribute and solve for y: y = 2x − 2 + 3 = 2x + 1."},
    {t:"Substitution", q:"Solve by substitution: y = 2x − 1 and 3x + y = 14.",
     o:["(3, 5)","(5, 3)","(3, −5)","(2, 3)"], a:0,
     e:"Substitute y = 2x − 1: 3x + (2x − 1) = 14 → 5x = 15 → x = 3, then y = 5. Solution (3, 5)."},
    {t:"Substitution", q:"Solve by substitution: x − y = 1 and 2x + 3y = 12.",
     o:["(3, 2)","(2, 3)","(1, 2)","(3, −2)"], a:0,
     e:"From x − y = 1, x = y + 1. Substitute: 2(y + 1) + 3y = 12 → 5y = 10 → y = 2, x = 3. Solution (3, 2)."},
    {t:"Elimination (addition)", q:"Solve by elimination: 5x + 2y = 16 and 3x − 2y = 0.",

    {t:"Read the solution", q:"The final matrix is [[1, 0 | 5], [0, 1 | 1]]. What is the solution (x₁, x₂)?",

    {t:"Augmented-matrix solve", q:"Solve using augmented matrix methods: 3x₁ − x₂ = 7 and x₁ + 2x₂ = 7.",

    {t:"Augmented-matrix solve", q:"Solve using augmented matrices: 2x₁ − x₂ = 5 and −4x₁ + 2x₂ = 3.",

    {t:"Break-even", q:"A plant has fixed costs of $9,000 per day and variable costs of $40 per unit; each unit sells for $70. How many units to break even?",

  {id:"u3", name:"Unit 3", title:"Linear Programming", sec:"§5.1–5.3, 6.1–6.2", exam:true, q:[
    {t:"Corner-point theorem", q:"Where does the maximum or minimum of a linear objective function occur?",
     o:["At the center of the region","At a corner (vertex) of the feasible region","Anywhere inside the region","Outside the region"], a:1,
     e:"The corner-point theorem: an optimal value occurs at a <b>vertex of the feasible region</b>, so you test the corners."},
    {t:"Evaluating corners", q:"Maximize P = 5x + 3y over corners (0,0), (0,4), (3,0), (2,2). What is the max value?",
     o:["12","15","16","20"], a:2, e:"Test each: 0; 12; 15; 5·2+3·2 = <b>16</b> at (2,2)."},
    {t:"Evaluating corners", q:"Maximize P = 2x + 5y over corners (0,0), (0,6), (4,3), (7,0). What is the max value?",
     o:["14","23","30","35"], a:2, e:"Test each: 0; 30; 8+15=23; 14. The max is <b>30</b> at (0,6)."},
    {t:"Minimization", q:"Minimize C = 2x + 3y over corners (0,8), (4,2), (10,0). What is the minimum value?",
     o:["14","20","24","8"], a:0, e:"Test each: 24; 8+6=14; 20. The min is <b>14</b> at (4,2)."},
    {t:"Minimization", q:"Minimize C = 4x + y over corners (1,10), (3,4), (8,0). What is the minimum value?",
     o:["14","16","32","10"], a:0, e:"Test each: 4+10=14; 12+4=16; 32. The min is <b>14</b> at (1,10)."},
    {t:"Counting corners", q:"If a feasible region is a quadrilateral, how many corner points must you test?",
     o:["2","3","4","Infinitely many"], a:2, e:"A quadrilateral has <b>4</b> vertices, so you test all 4."},
    {t:"Graphing ≤", q:"For <span class='mono'>x + y ≤ 6</span>, which region is shaded?",
     o:["The side containing the origin","The side away from the origin","Only the line itself","The entire plane"], a:0,
     e:"Test the origin: 0 + 0 = 0 ≤ 6 is true, so shade the side <b>containing (0,0)</b>."},
    {t:"Graphing ≥", q:"Does the origin satisfy <span class='mono'>2x + 3y ≥ 12</span>?",
     o:["Yes, shade toward the origin","No, shade away from the origin","Only on the line","Cannot tell"], a:1,
     e:"Test the origin: 0 ≥ 12 is false, so the origin is NOT a solution — <b>shade away from the origin</b>."},
    {t:"Feasible region", q:"The feasible region for a system of inequalities is formed by the ___ of the individual solution regions.",
     o:["union","intersection","difference","complement"], a:1,
     e:"Every constraint must hold at once, so the feasible region is the <b>intersection</b> (overlap) of all the half-planes."},
    {t:"Slack variables", q:"What is the purpose of a slack variable in the simplex method?",
     o:["To make a variable negative","To turn a ≤ inequality into an equation","To delete a constraint","To graph the region"], a:1,
     e:"A slack variable absorbs the leftover amount so a ≤ constraint becomes an exact <b>equation</b> the simplex algorithm can use."},
    {t:"Slack variables", q:"A standard maximization problem has 3 constraints of the form ≤. How many slack variables are added?",
     o:["1","2","3","6"], a:2, e:"One slack variable per ≤ constraint, so <b>3</b>."},
    {t:"Setting up", q:"A bakery profits $4 per cake and $3 per pie. Which is the objective function to maximize?",
     o:["4x + 3y","x + y","4x − 3y","3x + 4y"], a:0, e:"With x cakes and y pies, profit P = <b>4x + 3y</b>."},
  ]},

  {id:"u4", name:"Unit 4", title:"Sets & Counting", sec:"§7.2–7.4", q:[
    {t:"Union of sets", q:"If |A| = 12, |B| = 7, and |A ∩ B| = 3, find |A ∪ B|.",
     o:["19","22","16","10"], a:2, e:"|A ∪ B| = |A| + |B| − |A ∩ B| = 12 + 7 − 3 = <b>16</b>."},
    {t:"Union of sets", q:"If |A| = 20, |B| = 15, and |A ∩ B| = 5, find |A ∪ B|.",
     o:["30","35","40","25"], a:0, e:"|A ∪ B| = 20 + 15 − 5 = <b>30</b>."},
    {t:"Intersection", q:"If |A ∪ B| = 25, |A| = 15, and |B| = 18, find |A ∩ B|.",
     o:["8","10","7","12"], a:0, e:"Rearrange inclusion-exclusion: |A ∩ B| = |A| + |B| − |A ∪ B| = 15 + 18 − 25 = <b>8</b>."},
    {t:"Subsets", q:"How many subsets does a set with 5 elements have?",
     o:["10","25","32","120"], a:2, e:"A set with n elements has 2ⁿ subsets: 2⁵ = <b>32</b>."},
    {t:"Subsets", q:"A pizza offers 4 topping choices. How many topping combinations are possible (including none)?",
     o:["8","16","24","4"], a:1, e:"Each topping is in or out, so 2⁴ = <b>16</b> possible combinations."},
    {t:"Factorials", q:"Evaluate 5! (5 factorial).",
     o:["25","120","20","720"], a:1, e:"5! = 5·4·3·2·1 = <b>120</b>."},
    {t:"Factorials", q:"Evaluate 6! (6 factorial).",
     o:["120","360","720","36"], a:2, e:"6! = 6·5·4·3·2·1 = <b>720</b>."},
    {t:"Permutations", q:"Evaluate P(7, 2) — arrangements of 2 items from 7.",
     o:["21","42","14","49"], a:1, e:"P(7,2) = 7·6 = <b>42</b>. Order matters, so multiply the top 2 descending factors."},
    {t:"Permutations", q:"How many 3-letter arrangements (no repeats) can be made from 7 distinct letters?",
     o:["210","343","21","35"], a:0, e:"P(7,3) = 7·6·5 = <b>210</b>."},
    {t:"Permutations", q:"How many ways can 5 distinct books be arranged in a row?",
     o:["25","120","60","5"], a:1, e:"P(5,5) = 5! = <b>120</b>."},
    {t:"Combinations", q:"Evaluate C(8, 3) — choosing 3 from 8 where order doesn't matter.",
     o:["56","336","24","112"], a:0, e:"C(8,3) = (8·7·6)/(3·2·1) = 336/6 = <b>56</b>."},
    {t:"Combinations", q:"Evaluate C(10, 2).",
     o:["45","90","20","100"], a:0, e:"C(10,2) = (10·9)/(2·1) = 90/2 = <b>45</b>."},
    {t:"Combinations", q:"How many ways can a committee of 3 be chosen from 10 people?",
     o:["30","720","120","1000"], a:2, e:"Order doesn't matter: C(10,3) = (10·9·8)/6 = 720/6 = <b>120</b>."},
    {t:"Complement", q:"The universal set U has 50 elements; set A has 30. How many are in A′?",
     o:["20","30","80","50"], a:0, e:"The complement is everything not in A: 50 − 30 = <b>20</b>."},
  ]},

  {id:"u5", name:"Unit 5", title:"Probability", sec:"§8.1–8.3", q:[
    {t:"Basic probability", q:"Roll a fair six-sided die. What is the probability of an even number?",
     o:["1/3","1/2","2/3","1/6"], a:1, e:"Even outcomes are 2, 4, 6 — 3 of 6: 3/6 = <b>1/2</b>."},
    {t:"Basic probability", q:"Roll a fair die. What is the probability of rolling a number greater than 4?",
     o:["1/3","1/2","2/3","1/6"], a:0, e:"Greater than 4 means 5 or 6 — 2 of 6: 2/6 = <b>1/3</b>."},
    {t:"Marbles", q:"A bag holds 3 red and 5 blue marbles. What is the probability of drawing a red one?",
     o:["3/5","3/8","5/8","1/3"], a:1, e:"3 red out of 8 total: <b>3/8</b>."},
    {t:"Complement", q:"If P(A) = 0.35, what is P(not A)?",
     o:["0.35","0.65","0.5","1.35"], a:1, e:"P(not A) = 1 − P(A) = 1 − 0.35 = <b>0.65</b>."},
    {t:"Two coins", q:"Flip two fair coins. What is the probability of two heads?",
     o:["1/2","1/3","1/4","3/4"], a:2, e:"Independent flips: ½ · ½ = <b>1/4</b>."},
    {t:"Two dice", q:"Roll two fair dice. What is the probability the sum is 7?",
     o:["1/6","1/12","1/8","7/36"], a:0, e:"Six ways make 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1), out of 36 → 6/36 = <b>1/6</b>."},
    {t:"Two dice", q:"Roll a fair die twice. What is the probability of getting two 6s?",
     o:["1/6","1/12","1/36","2/6"], a:2, e:"Independent: (1/6)·(1/6) = <b>1/36</b>."},
    {t:"Cards", q:"Draw one card from a 52-card deck. What is the probability it's a king?",
     o:["1/13","1/4","1/52","4/13"], a:0, e:"4 kings out of 52: 4/52 = <b>1/13</b>."},
    {t:"Cards", q:"Draw one card from a 52-card deck. What is the probability it's a heart?",
     o:["1/13","1/4","1/2","13/13"], a:1, e:"13 hearts out of 52: 13/52 = <b>1/4</b>."},
    {t:"Mutually exclusive", q:"Events A and B can't both happen. If P(A) = 0.3 and P(B) = 0.45, find P(A or B).",
     o:["0.135","0.75","0.15","0.30"], a:1, e:"For mutually exclusive events, P(A or B) = P(A) + P(B) = <b>0.75</b> (no overlap)."},
    {t:"Addition rule", q:"If P(A) = 0.5, P(B) = 0.4, and P(A ∩ B) = 0.2, find P(A ∪ B).",
     o:["0.9","0.7","1.1","0.3"], a:1, e:"P(A ∪ B) = 0.5 + 0.4 − 0.2 = <b>0.7</b> (subtract the overlap)."},
    {t:"Conditional probability", q:"If P(A ∩ B) = 0.12 and P(B) = 0.4, find P(A | B).",
     o:["0.048","0.3","0.52","0.28"], a:1, e:"P(A | B) = P(A ∩ B) / P(B) = 0.12 / 0.4 = <b>0.3</b>."},
    {t:"Independence", q:"A and B are independent with P(A) = 0.5 and P(B) = 0.6. Find P(A ∩ B).",
     o:["0.3","1.1","0.1","0.6"], a:0, e:"For independent events, multiply: 0.5 · 0.6 = <b>0.3</b>."},
    {t:"Odds", q:"The odds in favor of an event are 3 to 2. What is the probability?",
     o:["3/2","2/5","3/5","1/2"], a:2, e:"3 favorable out of 3+2 = 5 total: <b>3/5</b> = 0.6."},
  ]},

  {id:"u6", name:"Unit 6", title:"Expected Value", sec:"§8.5", q:[
    {t:"Expected value of a game", q:"A game pays $10 with probability 0.2 and loses $3 with probability 0.8. Find the expected value.",
     o:["+$2.00","−$0.40","+$7.00","−$2.40"], a:1, e:"EV = 0.2(10) + 0.8(−3) = 2 − 2.4 = <b>−$0.40</b> per play."},
    {t:"Spinner", q:"A spinner pays $20 with probability 0.25 and $0 otherwise. Find the expected payout.",
     o:["$5.00","$20.00","$2.50","$15.00"], a:0, e:"EV = 0.25(20) + 0.75(0) = <b>$5.00</b>."},
    {t:"Fair die payout", q:"You're paid the number shown on a fair die. What is the expected payout?",
     o:["3.0","3.5","4.0","6.0"], a:1, e:"EV = (1+2+3+4+5+6)/6 = 21/6 = <b>3.5</b>."},
    {t:"Weighted outcomes", q:"A variable takes values 0, 1, 2 with probabilities 0.5, 0.3, 0.2. Find E(X).",
     o:["1.0","0.7","0.5","1.5"], a:1, e:"E(X) = 0(0.5) + 1(0.3) + 2(0.2) = 0.3 + 0.4 = <b>0.7</b>."},
    {t:"Weighted outcomes", q:"A variable takes values −2, 0, 3 with probabilities 0.4, 0.4, 0.2. Find E(X).",
     o:["−0.2","0.2","0.6","−0.8"], a:0, e:"E(X) = −2(0.4) + 0(0.4) + 3(0.2) = −0.8 + 0.6 = <b>−0.2</b>."},
    {t:"Raffle", q:"A raffle sells 1,000 tickets with one $300 prize. What is a ticket's expected winnings?",
     o:["$3.00","$0.30","$30.00","$300"], a:1, e:"EV = (1/1000)(300) = <b>$0.30</b>."},
    {t:"Carnival game", q:"Win $8 with probability 1/6, lose $2 otherwise. What is the expected value?",

    {t:"Insurance-style bet", q:"A bet loses $5 with probability 0.9 and wins $50 with probability 0.1. Find the expected value.",
     o:["+$0.50","−$0.50","+$5.00","−$4.50"], a:0, e:"EV = 0.9(−5) + 0.1(50) = −4.5 + 5 = <b>+$0.50</b>."},
    {t:"Fair game", q:"A game is called 'fair' when its expected value equals what?",
     o:["The maximum payout","0","The entry cost","1"], a:1, e:"A fair game has an expected value of <b>0</b> — no long-run advantage to either side."},
  ]},

/* ============ CLOUD SYNC ============ */
/* ▼▼ Paste your Apps Script Web App URL (ends in /exec) between the quotes ▼▼ */
const SYNC_URL = "https://script.google.com/macros/s/AKfycbyn-DBk5f7z8w4maCyYQdXjBx0N9paSLatN-8t5kccP9ikArylSD0XuZKUBR8BKoQnUeg/exec";
/* ▲▲ ----------------------------------------------------------------- ▲▲ */
const APP_ID = "practice";
let CODE = (localStorage.getItem("fm_code") || "CAM").toUpperCase();
let saveTimer = null;

const KEY = "cam_fm_practice_best";
const best = JSON.parse(localStorage.getItem(KEY) || "{}");

function syncEnabled(){ return SYNC_URL && SYNC_URL.indexOf("PASTE_") === -1; }
function setStatus(s){
  const p = document.getElementById("syncPill"); if(!p) return;
  if(!syncEnabled()){ p.textContent = "⟳ Local only · tap to learn about sync"; p.classList.remove("on"); return; }
  const m = {loading:"⟳ Syncing…", saving:"⟳ Saving…", synced:"✓ Synced · "+CODE, saved:"✓ Synced · "+CODE, error:"⚠ Sync error · "+CODE};
  p.textContent = m[s] || ("✓ Synced · "+CODE);
  p.classList.toggle("on", s==="synced" || s==="saved");
}
async function cloudLoad(){
  if(!syncEnabled()) return null;
  try{
    const r = await fetch(`${SYNC_URL}?action=load&code=${encodeURIComponent(CODE)}&app=${APP_ID}&t=${Date.now()}`);
    const j = await r.json();
    return (j && j.ok) ? j.data : null;
  }catch(e){ return null; }
}
function cloudSave(){
  if(!syncEnabled()) return;
  clearTimeout(saveTimer);
  setStatus("saving");
  saveTimer = setTimeout(()=>{
    fetch(SYNC_URL, {method:"POST", body: JSON.stringify({code:CODE, app:APP_ID, data:{best}})})
      .then(()=>setStatus("saved")).catch(()=>setStatus("error"));
  }, 700);
}
function applyCloudState(data){
  if(data && data.best){
    for(const k in best) delete best[k];
    Object.assign(best, data.best);
    localStorage.setItem(KEY, JSON.stringify(best));
    if(document.getElementById("home").style.display !== "none") renderHome();
  }
}
async function cloudInit(){
  if(!syncEnabled()){ setStatus("local"); return; }
  setStatus("loading");
  applyCloudState(await cloudLoad());
  setStatus("synced");
}

/* ============ State ============ */
let pool=[], idx=0, correct=0, answered=false, curName="", curId="";

/* ============ Home ============ */
const grid=document.getElementById("unitGrid");
function renderHome(){
  grid.innerHTML="";
  UNITS.forEach(u=>{
    const b=best[u.id];
    grid.insertAdjacentHTML("beforeend",
      `<button class="unit" data-u="${u.id}">
        <div class="un">${u.name} · ${u.sec}</div>
        <div class="ut">${u.title}</div>
        <div class="us">${u.q.length} questions</div>
        ${u.exam?'<span class="exam">★ Midterm</span>':''}
        ${b!=null?`<div class="best">Best: ${b}%</div>`:''}
      </button>`);
  });
  grid.insertAdjacentHTML("beforeend",
    `<button class="allbtn" id="allBtn">🎲 Mixed review — all ${UNITS.reduce((s,u)=>s+u.q.length,0)} questions</button>`);
}
renderHome();

grid.addEventListener("click",e=>{
  const u=e.target.closest(".unit");
  if(u){const unit=UNITS.find(x=>x.id===u.dataset.u); start(unit.q.map(q=>({...q})), unit.title, unit.id);}
  if(e.target.id==="allBtn"){
    let all=[]; UNITS.forEach(u=>u.q.forEach(q=>all.push({...q})));
    start(shuffle(all), "Mixed Review", "mixed");
  }
});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ Quiz ============ */
const homeEl=document.getElementById("home"), quizEl=document.getElementById("quiz"), doneEl=document.getElementById("done");
function start(questions, name, id){
  pool=questions; idx=0; correct=0; curName=name; curId=id;
  homeEl.style.display="none"; doneEl.style.display="none"; quizEl.style.display="block";
  render();
}
function render(){
  answered=false;
  const q=pool[idx];
  document.getElementById("qMeta").textContent=`${curName} · ${idx+1} of ${pool.length}`;
  document.getElementById("scoreLbl").textContent=`${correct} correct`;
  document.getElementById("prog").style.width=(idx/pool.length*100)+"%";
  document.getElementById("qTopic").textContent=q.t;
  document.getElementById("qText").innerHTML=q.q;
  const opts=document.getElementById("opts"); opts.innerHTML="";
  q.o.forEach((opt,i)=>{
    opts.insertAdjacentHTML("beforeend",
      `<button class="opt" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${opt}</span></button>`);
  });
  document.getElementById("explain").classList.remove("show");
}
document.getElementById("opts").addEventListener("click",e=>{
  const btn=e.target.closest(".opt"); if(!btn||answered)return;
  answered=true;
  const q=pool[idx], chosen=+btn.dataset.i;
  document.querySelectorAll(".opt").forEach((o,i)=>{
    o.disabled=true;
    if(i===q.a)o.classList.add("correct");
    if(i===chosen&&chosen!==q.a)o.classList.add("wrong");
  });
  const v=document.getElementById("verdict");
  if(chosen===q.a){correct++; v.textContent="✓ Correct"; v.className="verdict ok";}
  else{v.textContent="✗ Not quite"; v.className="verdict no";}
  document.getElementById("scoreLbl").textContent=`${correct} correct`;
  document.getElementById("explainText").innerHTML=q.e;
  document.getElementById("explain").classList.add("show");
  document.getElementById("nextBtn").textContent = idx===pool.length-1 ? "See results" : "Next question";
});
document.getElementById("nextBtn").addEventListener("click",()=>{
  if(idx<pool.length-1){idx++; render(); window.scrollTo({top:0,behavior:"smooth"});}
  else finish();
});
function finish(){
  const pct=Math.round(correct/pool.length*100);
  quizEl.style.display="none"; doneEl.style.display="block";
  document.getElementById("donePct").textContent=pct+"%";
  document.getElementById("donePct").style.color = pct>=80?"var(--green)":pct>=70?"#c9962b":"var(--coral)";
  const msg = pct>=90?"Excellent — exam ready!":pct>=80?"Strong work!":pct>=70?"Solid — review the misses":"Keep practicing — you'll get there";
  document.getElementById("doneMsg").textContent=msg;
  document.getElementById("doneSub").textContent=`${correct} of ${pool.length} correct on ${curName}`;
  if(curId!=="mixed" && (best[curId]==null || pct>best[curId])){
    best[curId]=pct; localStorage.setItem(KEY,JSON.stringify(best)); cloudSave();
  }
}
document.getElementById("retryBtn").addEventListener("click",()=>start(shuffle(pool), curName, curId));
document.getElementById("homeBtn").addEventListener("click",()=>{doneEl.style.display="none"; homeEl.style.display="block"; renderHome();});
document.getElementById("backBtn").addEventListener("click",()=>{quizEl.style.display="none"; homeEl.style.display="block"; renderHome();});

/* ============ Sync pill ============ */
document.getElementById("syncPill").addEventListener("click",()=>{
  if(!syncEnabled()){
    alert("Cloud sync isn't set up yet.\n\nDeploy the finite-math-sync.gs file as a Google Apps Script Web App, then paste its /exec URL into the SYNC_URL line near the top of this file's script. Best scores will then sync across devices using the access code.");
    return;
  }
  const c = prompt("Sync code (scores are shared across devices with the same code):", CODE);
  if(c && c.trim()){ CODE = c.trim().toUpperCase(); localStorage.setItem("fm_code", CODE); cloudInit(); }
});
cloudInit();
</script>
